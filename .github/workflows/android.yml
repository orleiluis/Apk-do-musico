name: Build do APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Publicar o APK em Releases (link direto para baixar no celular).
permissions:
  contents: write

jobs:
  motor:
    name: Testes do motor de áudio (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e rodar
        run: |
          cmake -S core/audio/src/test/cpp -B build-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests
          ./build-tests/engine_tests

  # Modelo de separação de faixas do Timbre Chord (htdemucs_6s convertido para ONNX e conferido
  # contra o PyTorch). Fica no cache: só roda de novo quando tools/separation muda.
  modelo:
    name: Modelo de separação (Timbre Chord)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache do modelo convertido
        id: cache
        uses: actions/cache@v4
        with:
          path: sep-out
          key: htdemucs6s-${{ hashFiles('tools/separation/**') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.10'
      - name: Instalar PyTorch, Demucs e ONNX
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -q torch==2.0.1 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r tools/separation/requirements.txt
      - name: Converter e conferir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          python tools/separation/export.py sep-out 2>&1 | tee export.log
          rm -rf sep-out/work
      - name: Erro da conversão
        if: failure()
        run: tail -25 export.log | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: sep-model
          path: sep-out/model
          retention-days: 3

  apk:
    name: APK de teste
    needs: modelo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sep-model
          path: timbrechord/src/main/assets/separation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes Kotlin e build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-do-musico-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Tamanho do APK
        run: ls -l app/build/outputs/apk/debug/*.apk | awk '{printf "::notice::APK %.1f MB\n", $5/1048576}'
      # Na main: publica o APK numa Release. O link
      # https://github.com/orleiluis/Apk-do-musico/releases/latest/download/ApkDoMusico.apk
      # sempre baixa a versão mais nova, direto no celular e sem login.
      - name: Preparar APK para Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/*.apk ApkDoMusico.apk
      - name: Publicar APK em Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: Apk do Músico v0.${{ github.run_number }}
          body: APK de teste gerado da main (${{ github.sha }}).
          files: ApkDoMusico.apk
          make_latest: true
