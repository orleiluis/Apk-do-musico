name: Build do APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  motor:
    name: Testes do motor de áudio (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e rodar
        run: |
          cmake -S core/audio/src/test/cpp -B build-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests
          ./build-tests/engine_tests

  apk:
    name: APK de teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes Kotlin e build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-do-musico-debug
          path: app/build/outputs/apk/debug/*.apk
